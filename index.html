<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12302b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ডিজিটাল খাতা – পাবো দেবোর হিসাব</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet">
<style>
:root{--ink:#12302b;--ink2:#1d4a42;--paper:#f2f6f1;--card:#fff;--line:#dde7e0;--pabo:#0e7a63;--dibo:#c0264b;--gold:#e3b23c;--text:#16241f;--mute:#6b7d75;--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Hind Siliguri',system-ui,sans-serif;color:var(--text);background:var(--paper) repeating-linear-gradient(to bottom,transparent 0 35px,rgba(14,122,99,.07) 35px 36px);padding-bottom:calc(96px + var(--sb));min-height:100vh}
.serif{font-family:'Tiro Bangla','Hind Siliguri',serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.top{background:var(--ink);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 62px;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:42px;height:42px;border-radius:12px;background:var(--gold);color:var(--ink);display:grid;place-items:center;font:400 22px 'Tiro Bangla',serif;transform:rotate(-6deg)}
.brand h1{margin:0;font:400 22px/1.1 'Tiro Bangla',serif}
.brand p{margin:2px 0 0;font-size:12px;opacity:.7}
.icon-btn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.1);color:#fff;font-size:20px}
.wrap{max-width:1080px;margin:0 auto;padding:0 14px}
.hero{margin-top:-46px;background:var(--ink);color:#fff;border-radius:22px;padding:6px;box-shadow:0 14px 30px -12px rgba(18,48,43,.55)}
.hero-in{border:1px dashed rgba(227,178,60,.55);border-radius:17px;padding:16px 14px 14px}
.split{display:grid;grid-template-columns:1fr 1px 1fr;gap:12px}
.split hr{border:0;background:rgba(227,178,60,.4);margin:0}
.side span{font-size:13px;opacity:.75;display:block}
.side b{display:block;font:400 clamp(22px,6.4vw,34px)/1.25 'Tiro Bangla',serif;margin-top:2px;word-break:break-word}
.side small{font-size:12px;opacity:.6}
.side.p b{color:#7be3bd}.side.d b{color:#ff9bb0}
.bar{height:6px;border-radius:9px;background:var(--dibo);margin:14px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;width:50%;background:var(--pabo);background:#2bc096;transition:width .5s}
.net{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.net b{font:400 18px 'Tiro Bangla',serif;color:var(--gold)}
.search{margin:16px 0 4px;position:relative}
.search input{width:100%;padding:12px 14px 12px 40px;border-radius:14px;border:1px solid var(--line);background:#fff;outline:none}
.search input:focus{border-color:var(--ink2);box-shadow:0 0 0 3px rgba(29,74,66,.15)}
.search:before{content:"⌕";position:absolute;left:14px;top:50%;transform:translateY(-52%);font-size:20px;color:var(--mute)}
main{display:grid;gap:18px;margin-top:14px}
.sec h2{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 8px;font:400 19px 'Tiro Bangla',serif}
.sec h2 small{font:600 13px 'Hind Siliguri';color:var(--mute)}
.sheetlist{background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:0 1px 0 rgba(0,0,0,.03)}
.row{--c:var(--pabo);border-left:5px solid var(--c);border-bottom:1px solid var(--line);padding:13px 14px}
.row:last-child{border-bottom:0}
.row.dibo{--c:var(--dibo)}
.main{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;cursor:pointer}
.who b{font-weight:600;font-size:16px}
.meta{display:block;font-size:12px;color:var(--mute);margin-top:1px}
.amt{font:400 20px 'Tiro Bangla',serif;color:var(--c);white-space:nowrap}
.prog{height:5px;background:#e8efea;border-radius:9px;margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--c);border-radius:9px}
.pmeta{font-size:11.5px;color:var(--mute);margin-top:4px}
.acts{display:none;flex-wrap:wrap;gap:8px;margin-top:12px}
.row.open .acts{display:flex}
.chip{padding:8px 13px;border-radius:11px;font-size:13.5px;font-weight:600;background:#eef3ef;color:var(--ink);text-decoration:none;display:inline-flex;gap:5px;align-items:center}
.chip.go{background:var(--pabo);color:#fff}.chip.rm{color:var(--dibo);background:#fdecef}
.empty{padding:34px 20px;text-align:center;color:var(--mute);font-size:14px}
.empty b{display:block;font:400 18px 'Tiro Bangla',serif;color:var(--text);margin-bottom:4px}
.hrow{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);border-left:5px solid #c5d3ca;font-size:14px}
.hrow:last-child{border-bottom:0}
.tag{font-size:11px;font-weight:600;padding:1px 8px;border-radius:20px;margin-left:6px;background:#e1f3ec;color:var(--pabo)}
.tag.dibo{background:#fdecef;color:var(--dibo)}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:6px 10px calc(6px + var(--sb));z-index:20}
.nav button{padding:8px 4px;border-radius:12px;font-size:13px;font-weight:600;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:1px}
.nav button em{font:400 17px 'Tiro Bangla',serif;font-style:normal}
body[data-tab=pabo] .nav [data-t=pabo]{color:var(--pabo);background:#e4f4ee}
body[data-tab=dibo] .nav [data-t=dibo]{color:var(--dibo);background:#fdecef}
body[data-tab=hist] .nav [data-t=hist]{color:var(--ink);background:#e8eeea}
.fab{position:fixed;right:18px;bottom:calc(84px + var(--sb));width:58px;height:58px;border-radius:19px;background:var(--gold);color:var(--ink);font-size:32px;line-height:1;box-shadow:0 10px 22px -6px rgba(18,48,43,.6);z-index:25;transition:transform .15s}
.fab:active{transform:scale(.92)}
@media(max-width:899px){.sec{display:none}body[data-tab=pabo] #s-pabo,body[data-tab=dibo] #s-dibo,body[data-tab=hist] #s-hist{display:block}}
@media(min-width:900px){main{grid-template-columns:1fr 1fr;align-items:start}#s-hist{grid-column:1/-1}.nav{display:none}.fab{bottom:28px}body{padding-bottom:100px}.top{padding-left:max(18px,calc(50vw - 540px));padding-right:max(18px,calc(50vw - 540px))}}
.bg{position:fixed;inset:0;background:rgba(10,26,23,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
.bg.on{display:flex;animation:fade .18s}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + var(--sb));max-height:92vh;overflow:auto;animation:up .24s cubic-bezier(.2,.8,.2,1)}
@media(min-width:600px){.bg{align-items:center}.sheet{border-radius:24px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}@keyframes fade{from{opacity:0}}
.sheet h3{margin:0 0 12px;font:400 21px 'Tiro Bangla',serif}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#edf2ee;padding:4px;border-radius:14px;margin-bottom:12px}
.seg label{text-align:center}.seg input{position:absolute;opacity:0}
.seg span{display:block;padding:10px 6px;border-radius:11px;font-weight:600;font-size:14px;color:var(--mute)}
.seg input:checked+span.p{background:var(--pabo);color:#fff}.seg input:checked+span.d{background:var(--dibo);color:#fff}
.f{display:block;margin-bottom:11px}.f>span{display:block;font-size:12.5px;font-weight:600;color:var(--mute);margin-bottom:4px}
.f input{width:100%;padding:12px 13px;border-radius:12px;border:1px solid #cfdcd3;background:#fbfdfb;outline:none;font-size:16px}
.f input:focus{border-color:var(--ink2);box-shadow:0 0 0 3px rgba(29,74,66,.15)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:14px;border-radius:14px;background:var(--ink);color:#fff;font-weight:700;font-size:16px;margin-top:4px}
.btn.alt{background:#edf2ee;color:var(--ink)}.btn.red{background:var(--dibo)}
.mi{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px 12px;border-radius:14px;font-weight:600;background:#f3f7f4;margin-bottom:8px}
.quick{display:flex;gap:8px;margin:-4px 0 10px}
.toast{position:fixed;left:50%;bottom:calc(92px + var(--sb));transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;display:flex;gap:14px;align-items:center;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:92vw}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast.err{background:var(--dibo)}.toast button{color:var(--gold);font-weight:700}
@media print{.nav,.fab,.top button,.search,.acts,.toast{display:none!important}.sec{display:block!important}body{background:#fff}.top{padding-bottom:50px}main{display:block}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-tab="pabo">

<header class="top">
  <div class="brand"><div class="logo">খা</div><div><h1>ডিজিটাল খাতা</h1><p>পাবো, দেবো – সব হিসাব হাতের মুঠোয়</p></div></div>
  <button class="icon-btn" id="menu-btn" aria-label="মেনু">⋯</button>
</header>

<div class="wrap">
  <section class="hero"><div class="hero-in">
    <div class="split">
      <div class="side p"><span>মোট পাবো</span><b id="tp">৳ ০</b><small id="cp">০ জনের কাছে</small></div><hr>
      <div class="side d"><span>মোট দেবো</span><b id="td">৳ ০</b><small id="cd">০ জনকে</small></div>
    </div>
    <div class="bar"><i id="bp"></i></div>
    <div class="net"><span id="net-l">হিসাব সমান আছে</span><b id="net">৳ ০</b></div>
  </div></section>

  <div class="search"><input id="q" type="search" placeholder="নাম বা বিবরণ দিয়ে খুঁজুন" autocomplete="off"></div>

  <main>
    <section class="sec" id="s-pabo"><h2>পাবো <small id="sp"></small></h2><div class="sheetlist" id="l-pabo"></div></section>
    <section class="sec" id="s-dibo"><h2>দেবো <small id="sd"></small></h2><div class="sheetlist" id="l-dibo"></div></section>
    <section class="sec" id="s-hist"><h2>পরিশোধিত ইতিহাস <small id="sh"></small></h2><div class="sheetlist" id="l-hist"></div></section>
  </main>
</div>

<button class="fab" id="fab" aria-label="নতুন হিসাব">+</button>

<nav class="nav">
  <button data-t="pabo"><em id="n-pabo">০</em>পাবো</button>
  <button data-t="dibo"><em id="n-dibo">০</em>দেবো</button>
  <button data-t="hist"><em id="n-hist">০</em>ইতিহাস</button>
</nav>

<!-- Add -->
<div class="bg" id="m-add"><form class="sheet" id="f-add">
  <h3>নতুন হিসাব</h3>
  <div class="seg">
    <label><input type="radio" name="t" value="pabo" checked><span class="p">পাবো (ধার দিলাম)</span></label>
    <label><input type="radio" name="t" value="dibo"><span class="d">দেবো (ধার নিলাম)</span></label>
  </div>
  <label class="f"><span>নাম *</span><input id="a-name" required placeholder="যেমন: করিম ভাই" autocomplete="off"></label>
  <div class="two">
    <label class="f"><span>টাকা *</span><input id="a-amt" type="number" inputmode="decimal" min="1" step="any" required placeholder="৫০০০"></label>
    <label class="f"><span>তারিখ</span><input id="a-date" type="date" required></label>
  </div>
  <label class="f"><span>মোবাইল (ঐচ্ছিক)</span><input id="a-ph" type="tel" inputmode="tel" placeholder="017XXXXXXXX"></label>
  <label class="f"><span>বিবরণ (ঐচ্ছিক)</span><input id="a-note" placeholder="কীসের জন্য?" autocomplete="off"></label>
  <button class="btn">খাতায় তুলুন</button>
  <button type="button" class="btn alt" data-close style="margin-top:8px">বাতিল</button>
</form></div>

<!-- Pay -->
<div class="bg" id="m-pay"><form class="sheet" id="f-pay">
  <h3>টাকা জমা</h3>
  <p id="pay-info" style="margin:0 0 12px;color:var(--mute);font-size:14px"></p>
  <label class="f"><span>কত টাকা?</span><input id="p-amt" type="number" inputmode="decimal" min="1" step="any" required></label>
  <div class="quick"><button type="button" class="chip" id="p-all">সবটা</button><button type="button" class="chip" id="p-half">অর্ধেক</button></div>
  <button class="btn">জমা নিন</button>
  <button type="button" class="btn alt" data-close style="margin-top:8px">বাতিল</button>
</form></div>

<!-- Menu -->
<div class="bg" id="m-menu"><div class="sheet">
  <h3>মেনু</h3>
  <button class="mi" id="x-exp">⬇ ব্যাকআপ ডাউনলোড (ফাইল)</button>
  <button class="mi" id="x-imp">⬆ ব্যাকআপ ফেরত আনুন</button>
  <button class="mi" id="x-prn">🖨 প্রিন্ট করুন</button>
  <button class="mi" id="x-clr" style="color:var(--dibo);background:#fdecef">🗑 সব হিসাব মুছুন</button>
  <input type="file" id="x-file" accept="application/json" hidden>
  <button class="btn alt" data-close>বন্ধ করুন</button>
</div></div>

<!-- Clear confirm -->
<div class="bg" id="m-clr"><div class="sheet">
  <h3>নিশ্চিত?</h3>
  <p style="color:var(--mute);margin:0 0 14px">সব হিসাব ও ইতিহাস মুছে যাবে, ফিরে পাওয়া যাবে না। আগে ব্যাকআপ নিয়ে রাখতে পারেন।</p>
  <button class="btn red" id="x-clr-ok">হ্যাঁ, সব মুছুন</button>
  <button class="btn alt" data-close style="margin-top:8px">না, থাক</button>
</div></div>

<div class="toast" id="toast"><span id="t-msg"></span><button id="t-act" hidden>ফিরিয়ে আনুন</button></div>

<script>
const $=id=>document.getElementById(id);
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const money=a=>'৳ '+bn(Number(a).toLocaleString('en-IN',{maximumFractionDigits:2}));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localDate=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const MON=['জানু','ফেব্রু','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টে','অক্টো','নভে','ডিসে'];
const fdate=s=>{if(!s)return'';const [y,m,d]=s.split('-');return `${bn(+d)} ${MON[m-1]}, ${bn(y)}`};
const ago=s=>{if(!s)return'';const [y,m,d]=s.split('-');const n=Math.floor((new Date(localDate().replace(/-/g,'/'))-new Date(`${y}/${m}/${d}`))/864e5);return n>0?`${bn(n)} দিন হলো`:'আজ'};
const load=(k)=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}};
let debts=load('tali_khata_debts'),hist=load('tali_khata_history'),undoItem=null,payId=null,tt;
function save(){try{localStorage.setItem('tali_khata_debts',JSON.stringify(debts));localStorage.setItem('tali_khata_history',JSON.stringify(hist))}catch(e){toast('ফোনে সংরক্ষণ করা যাচ্ছে না',{err:1})}render()}
function toast(msg,o={}){const t=$('toast');$('t-msg').textContent=msg;t.classList.toggle('err',!!o.err);const b=$('t-act');b.hidden=!o.undo;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),o.undo?5000:2800)}
const open=id=>{$(id).classList.add('on')},closeAll=()=>document.querySelectorAll('.bg.on').forEach(e=>e.classList.remove('on'));
document.querySelectorAll('.bg').forEach(b=>b.addEventListener('click',e=>{if(e.target===b||e.target.hasAttribute('data-close'))closeAll()}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});

function row(d){
  const paid=(d.initialAmount||d.amount)-d.amount,init=d.initialAmount||d.amount;
  const call=d.phone?`<a class="chip" href="tel:${esc(d.phone)}">📞 কল</a>`:'';
  const sms=d.phone&&d.type==='pabo'?`<a class="chip" href="sms:${esc(d.phone)}?body=${encodeURIComponent(`${d.name}, আপনার কাছে আমার ${money(d.amount)} পাওনা আছে। সুবিধামতো দিয়ে দিলে ভালো হয়।`)}">✉ মনে করান</a>`:'';
  return `<article class="row ${d.type}" data-id="${d.id}">
  <div class="main" data-act="tog"><div class="who"><b>${esc(d.name)}</b><span class="meta">${fdate(d.date)} · ${ago(d.date)}${d.note?' · '+esc(d.note):''}</span></div><div class="amt">${money(d.amount)}</div></div>
  ${paid>0?`<div class="prog"><i style="width:${Math.min(100,paid/init*100)}%"></i></div><div class="pmeta">মোট ${money(init)} এর মধ্যে ${money(paid)} জমা হয়েছে</div>`:''}
  <div class="acts"><button class="chip" data-act="pay">＋ জমা</button><button class="chip go" data-act="settle">✓ সম্পূর্ণ শোধ</button>${call}${sms}<button class="chip rm" data-act="del">মুছুন</button></div></article>`}

function render(){
  const q=$('q').value.trim().toLowerCase();
  const m=d=>!q||d.name.toLowerCase().includes(q)||(d.note||'').toLowerCase().includes(q);
  let tp=0,td=0,cp=0,cd=0;
  debts.forEach(d=>{if(d.type==='pabo'){tp+=d.amount;cp++}else{td+=d.amount;cd++}});
  $('tp').textContent=money(tp);$('td').textContent=money(td);
  $('cp').textContent=`${bn(cp)} জনের কাছে`;$('cd').textContent=`${bn(cd)} জনকে`;
  $('bp').style.width=(tp+td?tp/(tp+td)*100:50)+'%';
  const net=tp-td;$('net').textContent=money(Math.abs(net));
  $('net-l').textContent=net>0?'সব মিলিয়ে আপনি পাবেন':net<0?'সব মিলিয়ে আপনি দেবেন':'হিসাব সমান আছে';
  for(const t of ['pabo','dibo']){
    const all=debts.filter(d=>d.type===t),list=all.filter(m);
    $('l-'+t).innerHTML=list.length?list.map(row).join(''):`<div class="empty"><b>${q&&all.length?'কিছু পাওয়া যায়নি':t==='pabo'?'কারও কাছে পাওনা নেই':'কারও কাছে দেনা নেই'}</b>${q&&all.length?'অন্য নামে খুঁজে দেখুন':'নিচের ＋ বোতামে চেপে হিসাব যোগ করুন'}</div>`;
    $('n-'+t).textContent=bn(all.length);
    $(t==='pabo'?'sp':'sd').textContent=all.length?money(t==='pabo'?tp:td):'';
  }
  const h=hist.filter(m);
  $('l-hist').innerHTML=h.length?h.map(x=>`<div class="hrow"><div><b>${esc(x.name)}</b><span class="tag ${x.type}">${x.type==='pabo'?'পাবো ছিল':'দেবো ছিল'}</span><span class="meta">${x.note?esc(x.note)+' · ':''}শোধ: ${fdate(x.settledDate)}</span></div><b style="white-space:nowrap">${money(x.amount)}</b></div>`).join(''):`<div class="empty"><b>ইতিহাস ফাঁকা</b>পুরো শোধ হলে হিসাব এখানে জমা হবে</div>`;
  $('n-hist').textContent=bn(hist.length);$('sh').textContent=hist.length?`${bn(hist.length)} টি`:'';
}

function setTab(t){document.body.dataset.tab=t;scrollTo({top:0})}
document.querySelector('.nav').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b)setTab(b.dataset.t)});
$('q').addEventListener('input',render);

document.querySelector('main').addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const r=el.closest('.row'),id=+r.dataset.id,d=debts.find(x=>x.id===id),a=el.dataset.act;
  if(a==='tog')r.classList.toggle('open');
  if(a==='pay'){payId=id;$('pay-info').innerHTML=`<b>${esc(d.name)}</b> – বাকি আছে ${money(d.amount)}`;$('p-amt').value='';$('p-amt').max=d.amount;open('m-pay');setTimeout(()=>$('p-amt').focus(),120)}
  if(a==='settle')settle(id);
  if(a==='del'){const i=debts.findIndex(x=>x.id===id);undoItem={d:debts[i],i};debts.splice(i,1);save();toast('হিসাবটি মুছে গেছে',{undo:1})}
});
$('t-act').onclick=()=>{if(undoItem){debts.splice(undoItem.i,0,undoItem.d);undoItem=null;save();$('toast').classList.remove('on')}};

function settle(id){
  const i=debts.findIndex(x=>x.id===id);if(i<0)return;const d=debts[i];
  hist.unshift({id:Date.now(),type:d.type,name:d.name,amount:d.initialAmount||d.amount,phone:d.phone,note:d.note,originalDate:d.date,settledDate:localDate()});
  debts.splice(i,1);save();toast('পুরো শোধ হয়েছে, ইতিহাসে রাখা হলো ✓')}

$('fab').onclick=()=>{$('a-date').value=localDate();const t=document.body.dataset.tab;if(t==='dibo')document.querySelector('[name=t][value=dibo]').checked=true;else document.querySelector('[name=t][value=pabo]').checked=true;open('m-add');setTimeout(()=>$('a-name').focus(),150)};
$('f-add').addEventListener('submit',e=>{
  e.preventDefault();
  const type=document.querySelector('[name=t]:checked').value,name=$('a-name').value.trim(),amount=parseFloat($('a-amt').value);
  if(!name||!(amount>0)){toast('নাম ও সঠিক টাকা দিন',{err:1});return}
  debts.unshift({id:Date.now(),type,name,amount,initialAmount:amount,phone:$('a-ph').value.trim(),note:$('a-note').value.trim(),date:$('a-date').value||localDate(),settled:false});
  e.target.reset();closeAll();setTab(type);save();toast(type==='pabo'?'পাবো তালিকায় উঠেছে':'দেবো তালিকায় উঠেছে')});

$('p-all').onclick=()=>{const d=debts.find(x=>x.id===payId);if(d)$('p-amt').value=d.amount};
$('p-half').onclick=()=>{const d=debts.find(x=>x.id===payId);if(d)$('p-amt').value=+(d.amount/2).toFixed(2)};
$('f-pay').addEventListener('submit',e=>{
  e.preventDefault();const d=debts.find(x=>x.id===payId),p=parseFloat($('p-amt').value);
  if(!d||!(p>0)){toast('সঠিক টাকা দিন',{err:1});return}
  if(p>d.amount){toast('বাকির চেয়ে বেশি জমা হবে না',{err:1});return}
  closeAll();d.initialAmount=d.initialAmount||d.amount;d.amount=+(d.amount-p).toFixed(2);
  if(d.amount<=0)settle(d.id);else{save();toast(`${money(p)} জমা হলো, বাকি ${money(d.amount)}`)}});

$('menu-btn').onclick=()=>open('m-menu');
$('x-prn').onclick=()=>{closeAll();setTimeout(print,200)};
$('x-clr').onclick=()=>{closeAll();open('m-clr')};
$('x-clr-ok').onclick=()=>{debts=[];hist=[];save();closeAll();toast('সব হিসাব মুছে ফেলা হয়েছে')};
$('x-exp').onclick=()=>{const b=new Blob([JSON.stringify({debts,history:hist},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`khata-backup-${localDate()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);closeAll();toast('ব্যাকআপ ফাইল নামানো হয়েছে')};
$('x-imp').onclick=()=>$('x-file').click();
$('x-file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j.debts)||!Array.isArray(j.history))throw 0;debts=j.debts;hist=j.history;save();closeAll();toast('ব্যাকআপ ফেরত এসেছে ✓')}catch(x){toast('ফাইলটি সঠিক ব্যাকআপ নয়',{err:1})}};r.readAsText(f);e.target.value=''};

render();
</script>
</body>
</html>
